services:
  postgres:
    image: postgres:16-alpine
    container_name: market-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_os
    ports:
      - '5433:5432'
    volumes:
      - market_os_pgdata:/var/lib/postgresql/data

volumes:
  market_os_pgdata:
